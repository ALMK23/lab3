server.port=${SERVER_PORT:8080}

# Чувствительные данные (адрес БД, логины, пароли) лежат в файле .env в корне проекта.
# Файл .env не коммитится — образец в .env.example. Переменные окружения ОС имеют приоритет над .env.
spring.config.import=optional:file:.env[.properties]

# --- Подключение приложения: пользователь с ограниченными правами (только SELECT/INSERT/UPDATE/DELETE) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:translations}?currentSchema=${DB_SCHEMA:app}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}

# --- Миграции Flyway выполняются от владельца схемы (DDL), а не от пользователя приложения ---
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_OWNER_USER}
spring.flyway.password=${DB_OWNER_PASSWORD}
spring.flyway.schemas=${DB_SCHEMA:app}
spring.flyway.create-schemas=false

# Схему создаёт только Flyway; Hibernate лишь сверяет её с сущностями.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:app}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

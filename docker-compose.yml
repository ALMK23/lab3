services:
  postgres:
    image: postgres:16
    container_name: translations-db
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/db/init.sql:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
